[tool.poetry]
name = "BPMN_evaluation_framework"
version = "0.1.0"
description = "Framework for evaluating and comparing BPMN process models using structural and behavioral (trace-based) similarity metrics."
authors = ["raheleh <raheleh.hadian@sap.com>"]
readme = "README.md"
packages = [
    #{ include = "bpmn_evaluation_framework" },
    { include = "model_evaluation" },
]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.13.4"
sentence-transformers = "^4.1.0"
marimo = {version = "^0.13", optional = true}
plotly = {version = "^5.24.0", optional = true}
pandas = {version = "^2.2.3", optional = true}
matplotlib = {version = "^3.10.7", optional = true}
ipykernel = {version = "^6.29.5", optional = true}
nbformat = {version = "^5.10.4", optional = true}

[tool.poetry.extras]
dashboard = [
    "marimo",
    "plotly",
    "pandas",
    "matplotlib",
    "ipykernel",
    "nbformat",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
